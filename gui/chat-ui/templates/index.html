<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XLM Chat</title>
<script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:24px auto;padding:0 16px;max-width:960px;color:#172438;background:#f5f7fb}h1{margin:20px 0}button,select,textarea{font:inherit}button{cursor:pointer;padding:9px 14px;border:1px solid #aebbd0;border-radius:8px;background:white}button:disabled{cursor:default;opacity:.5}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.controls select{max-width:100%;padding:8px}.controls label{min-width:0}#chatBox{min-height:280px;margin:20px 0}article{background:white;border:1px solid #dae0ea;border-radius:12px;padding:16px;margin:12px 0;overflow-wrap:anywhere}article p,article pre{white-space:pre-wrap;overflow-wrap:anywhere}article img{display:block;max-width:100%;max-height:600px}small{color:#4b5b70}.composer{padding:12px;background:white;border:1px solid #b4c2d6;border-radius:12px}.row{display:flex;gap:8px;align-items:center}#messageInput{flex:1;min-width:0;resize:vertical;padding:10px;border:0;min-height:50px}#sendButton{background:#194bb0;color:white}#attachment{display:flex;gap:10px;align-items:center;margin-bottom:10px;overflow-wrap:anywhere}#imagePreview{width:48px;height:48px;object-fit:contain}#schemaInput{display:block;width:100%;min-height:110px;font:13px monospace}details{margin:10px 0}#feedback{color:#9a2020;min-height:24px}#suggestion{padding:10px;background:#e4edff;border-radius:8px;margin-top:10px}[hidden]{display:none!important}@media(max-width:520px){body{margin:12px auto}.controls{align-items:stretch;flex-direction:column}.controls select{width:100%}.row{gap:4px}button{padding:8px}article{padding:12px}}
</style></head><body><nav><a href="/admin">XLM Administration</a></nav><h1>XLM Chat</h1>
<div class="controls"><label>Provider <select id="providerSelect" aria-label="Provider"></select></label><label>Model <select id="modelSelect" aria-label="Model"></select></label><button id="refreshModels">Refresh models</button><label><input id="generateMode" type="checkbox"> Generate image</label></div>
<p id="capabilityInfo" role="status">Loading model catalog…</p><div id="chatBox" role="log" aria-label="Conversation"></div><p id="feedback" role="alert"></p>
<div class="composer"><div id="attachment" hidden><img id="imagePreview" alt="Attached image"><span id="fileDetails"></span><button id="removeImage">Remove attachment</button></div>
<details id="advanced" hidden><summary>Advanced · result JSON Schema</summary><label for="schemaInput">Schema for image analysis</label><textarea id="schemaInput">{"type":"object","properties":{"description":{"type":"string"}},"required":["description"],"additionalProperties":false}</textarea></details>
<div class="row"><button id="attachButton" aria-label="Attach one image" title="Analyze one image: PNG, JPEG or WebP up to 3 MiB">+</button><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><textarea id="messageInput" aria-label="Prompt" placeholder="Type a prompt or attach an image" rows="1"></textarea><button id="sendButton">Send</button></div>
<div id="suggestion" hidden>This looks like an image creation request. <button id="acceptSuggestion">Enable Generate image</button> <button id="dismissSuggestion">Keep text</button></div></div>
<script>window.XLM_CHAT_CONFIG = {token: {{ ui_token|tojson }}, provider: {{ provider|tojson }}, model: {{ model_name|tojson }}};</script><script src="/static/chat.js"></script></body></html>
