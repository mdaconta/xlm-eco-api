<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XLM Chat</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            text-align: center;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px; /* Space below the app title */
            color: blue; /* App title in blue */
        }

        #chatBoxContainer {
            width: 80%; /* Matches the width of the input field and button */
            margin: 0 auto;
            margin-bottom: 20px; /* Add separation from input area */
        }

        #titleContainer {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px; /* Add space between title and chat box */
            text-align: left;
        }

        #chatBox {
            border: 1px solid #ccc;
            height: 300px;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            background-color: #f9f9f9;
            text-align: left;
            width: 100%; /* Matches the width of the container */
            box-sizing: border-box; /* Ensures padding is included in width */
        }

        #inputContainer {
            display: flex;
            justify-content: space-between; /* Align input and button */
            width: 80%; /* Matches chat box width */
            margin: 0 auto; /* Center the input container */
        }

        #messageInput {
            flex: 1; /* Fills remaining space */
            height: 40px; /* Matches the height of the button */
            padding: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Includes padding and border in width */
        }

        #sendButton {
            height: 50px; /* Matches the height of the input field */
            font-size: 16px;
            margin-left: 10px;
            padding: 0 15px;
        }
        #modeControls, #imagePanel, #feedback, #metadata {
            width: 80%;
            margin: 0 auto 16px;
            text-align: left;
            box-sizing: border-box;
        }
        #imagePanel {
            border: 1px solid #ccc;
            padding: 16px;
            background: #f9f9f9;
        }
        #imagePanel label { display: block; font-weight: bold; margin: 12px 0 5px; }
        #imagePanel textarea { width: 100%; box-sizing: border-box; min-height: 70px; font: inherit; }
        #schemaInput { min-height: 120px !important; font-family: monospace !important; }
        #imagePreview { display: block; max-width: 240px; max-height: 200px; margin-top: 10px; }
        #feedback { color: #8b0000; }
        #metadata { font-size: 14px; color: #333; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <p><a href="/admin">XLM Administration</a></p>
    <h1>XLM Chat</h1>
    <div id="modeControls">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
            <option value="text">Text chat</option>
            <option value="image">Analyze one image</option>
        </select>
        <span>Provider: <strong>{{ provider }}</strong> · Model: <strong>{{ model_name }}</strong></span>
    </div>
    <div id="chatBoxContainer">
        <div id="titleContainer"></div>
        <div id="chatBox"></div>
    </div>
    <div id="metadata" role="status"></div>
    <div id="feedback" role="alert"></div>
    <div id="inputContainer">
        <input type="text" id="messageInput" placeholder="Type your prompt here" />
        <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>
    <div id="imagePanel" hidden>
        <label for="imageInput">Image (PNG, JPEG or WebP, up to 3 MiB)</label>
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" />
        <img id="imagePreview" alt="Selected image preview" hidden />
        <div id="fileDetails"></div>
        <label for="imageInstructions">Visual instructions</label>
        <textarea id="imageInstructions">Describe what you see in this image.</textarea>
        <label for="schemaInput">Result JSON Schema</label>
        <textarea id="schemaInput">{"type":"object","properties":{"description":{"type":"string"}},"required":["description"],"additionalProperties":false}</textarea>
        <button id="analyzeButton" onclick="analyzeImage()">Analyze image</button>
    </div>

    <script>
        const uiToken = {{ ui_token|tojson }};
        const socket = io({auth: {token: uiToken}});
        const chatBox = document.getElementById('chatBox');
        const titleContainer = document.getElementById('titleContainer');
        const messageInput = document.getElementById('messageInput');
        const modeSelect = document.getElementById('modeSelect');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const fileDetails = document.getElementById('fileDetails');
        const feedback = document.getElementById('feedback');
        const metadata = document.getElementById('metadata');
        let previewUrl;

        modeSelect.addEventListener('change', () => {
            const imageMode = modeSelect.value === 'image';
            document.getElementById('inputContainer').hidden = imageMode;
            document.getElementById('imagePanel').hidden = !imageMode;
            chatBox.textContent = '';
            titleContainer.textContent = '';
            metadata.textContent = '';
            feedback.textContent = '';
        });

        imageInput.addEventListener('change', () => {
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            const file = imageInput.files[0];
            imagePreview.hidden = !file;
            fileDetails.textContent = file ? `${file.name} · ${file.type || 'unknown MIME'} · ${file.size} bytes` : '';
            if (file) {
                previewUrl = URL.createObjectURL(file);
                imagePreview.src = previewUrl;
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            fetch('/send_message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-XLM-UI-Token': uiToken},
                body: JSON.stringify({message: message})
            }).then(response => {
                if (response.ok) {
                    console.log("Message sent!");
                    messageInput.value = ""; // Clear the input field after submission
                    chatBox.textContent = ""; // Clear previous chat
                    titleContainer.textContent = ""; // Clear previous title
                } else {
                    feedback.textContent = 'Text chat request failed.';
                }
            });
        }

        async function analyzeImage() {
            const file = imageInput.files[0];
            const instructions = document.getElementById('imageInstructions').value.trim();
            const schema = document.getElementById('schemaInput').value.trim();
            feedback.textContent = '';
            metadata.textContent = '';
            if (!file || !instructions || !schema) {
                feedback.textContent = 'Choose one image, enter instructions, and provide a JSON Schema.';
                return;
            }
            if (file.size > 3 * 1024 * 1024) {
                feedback.textContent = 'Image exceeds the 3 MiB limit.';
                return;
            }
            try {
                const parsedSchema = JSON.parse(schema);
                if (!parsedSchema || typeof parsedSchema !== 'object' || Array.isArray(parsedSchema))
                    throw new Error('Schema must be an object');
            } catch (_) {
                feedback.textContent = 'JSON Schema must be a valid object.';
                return;
            }
            const form = new FormData();
            form.append('image', file);
            form.append('instructions', instructions);
            form.append('json_schema', schema);
            const button = document.getElementById('analyzeButton');
            button.disabled = true;
            titleContainer.textContent = 'Analyzing image';
            chatBox.textContent = '';
            try {
                const response = await fetch('/analyze_image', {
                    method: 'POST', headers: {'X-XLM-UI-Token': uiToken}, body: form
                });
                const result = await response.json();
                if (modeSelect.value !== 'image') return;
                if (!response.ok) {
                    feedback.textContent = result.error || 'Image request failed.';
                    if (result.transport_code) feedback.textContent += ` (${result.transport_code})`;
                    titleContainer.textContent = 'Image request failed';
                    return;
                }
                metadata.textContent = `Provider: ${result.provider} · Model: ${result.model} · ${result.status} · ${result.latency_ms} ms`;
                if (result.success) {
                    titleContainer.textContent = 'Structured image result';
                    chatBox.textContent = JSON.stringify(result.structured_result, null, 2);
                } else {
                    titleContainer.textContent = 'Image analysis failed';
                    chatBox.textContent = `${result.error_code}: ${result.error_message}`;
                    metadata.textContent += ` · Retryable: ${result.retryable}`;
                    if (result.provider_http_status) metadata.textContent += ` · Provider HTTP ${result.provider_http_status}`;
                }
            } catch (_) {
                if (modeSelect.value !== 'image') return;
                feedback.textContent = 'Could not reach the XLM chat UI server.';
                titleContainer.textContent = 'Image request failed';
            } finally {
                button.disabled = false;
            }
        }

        socket.on('chat_response', (data) => {
            if (modeSelect.value !== 'text') return;
            // Append received tokens to chatBox
            chatBox.textContent += data.message;
        });

        socket.on('chat_title', (data) => {
            if (modeSelect.value !== 'text') return;
            // Display the generated title at the top
            titleContainer.textContent = data.title;
        });
    </script>
</body>
</html>
